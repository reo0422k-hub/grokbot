<title>Grok Bot 導入支援</title>
<!--
  Grok Bot「部門の星系」コンポーネント（grokbot.lp / orbit.html「02 Use cases」から切り出し）
  ・画像はすべてこのファイルに埋め込み済み（外部ファイル不要）
  ・別サイトへの組み込み方：
      1. <style> の中身をそのサイトのCSSへ
      2. <div class="gbuc" data-gbuc> … </div> をそのまま置きたい場所へ
      3. <script type="application/json" data-gbuc-data> と最後の <script> をその後ろへ
  ・クラス名は gbuc- で始まるので、ほかのサイトのCSSとぶつかりにくい
  ・部門の文言・リンクは data-gbuc-data のJSONを書き換える
  ・背景の星空は元サイトのもの。ここでは .gbuc の背景色だけ付けている（不要なら .gbuc の background を消す）
-->
<style>
.gbuc {
  --gbuc-ink: #e9edff;
  --gbuc-ink-2: rgba(233, 237, 255, 0.74);
  --gbuc-ice: #a9c8ff;
  --gbuc-line: rgba(169, 200, 255, 0.22);
  --gbuc-serif: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  --gbuc-sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  --gbuc-latin: "Cormorant Garamond", "Times New Roman", serif;
  --gbuc-mono: "IBM Plex Mono", ui-monospace, monospace;
  --gbuc-ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  box-sizing: border-box;
  display: grid; grid-template-columns: minmax(320px, 460px) 1fr; gap: clamp(32px, 5vw, 72px); align-items: center;
  padding: clamp(24px, 5vw, 64px);
  color: var(--gbuc-ink); font-family: var(--gbuc-sans); line-height: 1.7;
  background: radial-gradient(ellipse at 30% 40%, #0d1a5c 0%, #050826 55%, #02030f 100%);
}
.gbuc *, .gbuc *::before, .gbuc *::after { box-sizing: border-box; }

/* 星系 */
.gbuc__system { position: relative; aspect-ratio: 1; width: 100%; --rot: 0deg; }
.gbuc__orbit { position: absolute; inset: 0; width: 100%; height: 100%; }
.gbuc__orbit ellipse { fill: none; stroke: var(--gbuc-line); stroke-dasharray: 2 6; }
.gbuc__orbit ellipse:first-child { animation: gbuc-spin 90s linear infinite; transform-origin: 200px 200px; }
.gbuc__core { position: absolute; left: 50%; top: 50%; width: 30%; transform: translate(-50%, -50%); }
.gbuc__core img { position: relative; display: block; width: 100%; filter: drop-shadow(0 0 30px rgba(140, 180, 255, 0.6)); animation: gbuc-float 6s ease-in-out infinite; }
.gbuc__core::before { content: ""; position: absolute; inset: -40%; border-radius: 50%; background: radial-gradient(circle, rgba(79, 125, 255, 0.4), transparent 65%); animation: gbuc-pulse 4s ease-in-out infinite; }
.gbuc__system button {
  --a: calc(var(--i) * 90deg - 90deg + var(--rot));
  position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1;
  display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; color: inherit; font: inherit;
  transform: translate(-50%, -50%) rotate(var(--a)) translate(var(--orbit-r, 180px)) rotate(calc(var(--a) * -1));
  transition: transform 1.2s var(--gbuc-ease);
}
.gbuc__system button img { display: block; width: 70%; transition: transform .5s var(--gbuc-ease), filter .5s; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5)) grayscale(0.4) brightness(0.8); }
.gbuc__system button span { position: absolute; top: 100%; white-space: nowrap; font-size: 0.74rem; color: var(--gbuc-ink-2); transition: color .4s; }
.gbuc__system button::before { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 1px solid transparent; transition: border-color .5s, box-shadow .5s; }
.gbuc__system button:hover img { transform: scale(1.12); filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5)); }
.gbuc__system button:focus-visible { outline: 2px solid var(--gbuc-ice); outline-offset: 2px; border-radius: 50%; }
.gbuc__system button[aria-selected="true"] img { transform: scale(1.25); filter: drop-shadow(0 0 18px rgba(169, 200, 255, 0.7)); }
.gbuc__system button[aria-selected="true"] span { color: #fff; font-weight: 700; }
.gbuc__system button[aria-selected="true"]::before { border-color: var(--gbuc-ice); box-shadow: 0 0 24px rgba(169, 200, 255, 0.45); animation: gbuc-pulse 3s ease-in-out infinite; }
.gbuc__system button img.is-dark { filter: drop-shadow(0 0 1px #cfe0ff) drop-shadow(0 0 8px rgba(140, 180, 255, 0.6)) !important; }

/* 説明パネル（選んだ部門の内容） */
.gbuc__panel {
  padding: clamp(28px, 4vw, 44px); min-height: 420px;
  background: linear-gradient(160deg, rgba(20, 34, 104, 0.55), rgba(6, 10, 40, 0.62));
  border: 1px solid var(--gbuc-line); border-radius: 22px;
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.gbuc__panel > * { animation: gbuc-panel .7s var(--gbuc-ease) both; }
.gbuc__panel > *:nth-child(2) { animation-delay: .06s; }
.gbuc__panel > *:nth-child(3) { animation-delay: .12s; }
.gbuc__panel > *:nth-child(4) { animation-delay: .18s; }
.gbuc__panel > *:nth-child(5) { animation-delay: .24s; }
.gbuc__en { margin: 0; font-family: var(--gbuc-latin); font-style: italic; font-size: 1.2rem; color: var(--gbuc-ice); }
.gbuc__panel h3 { margin: 0 0 18px; font-family: var(--gbuc-serif); font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-weight: 600; }
.gbuc__ask { margin: 0 0 22px; padding: 12px 16px; border-radius: 14px; background: rgba(169, 200, 255, 0.1); border-left: 2px solid var(--gbuc-ice); font-size: 1.02rem; }
.gbuc__ask span { margin-right: 10px; font-family: var(--gbuc-mono); font-size: 0.7rem; color: var(--gbuc-ice); letter-spacing: 0.12em; }
.gbuc__panel dl { margin: 0 0 22px; display: grid; gap: 14px; }
.gbuc__panel dl div { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid rgba(169, 200, 255, 0.12); }
.gbuc__panel dt { font-size: 0.78rem; color: var(--gbuc-ice); }
.gbuc__panel dd { margin: 0; font-size: 0.94rem; }
.gbuc__panel dd ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.gbuc__panel dd li { padding: 2px 12px; border-radius: 99px; border: 1px solid var(--gbuc-line); font-size: 0.84rem; }
.gbuc__link { color: var(--gbuc-ice); text-decoration: none; border-bottom: 1px solid var(--gbuc-line); padding-bottom: 2px; transition: color .3s, border-color .3s; }
.gbuc__link::after { content: " →"; display: inline-block; transition: transform .3s var(--gbuc-ease); }
.gbuc__link:hover { color: #fff; border-color: var(--gbuc-ice); }
.gbuc__link:hover::after { transform: translateX(4px); }

@keyframes gbuc-spin { to { transform: rotate(360deg); } }
@keyframes gbuc-float { 0%, 100% { translate: 0 -6px; rotate: -3deg; } 50% { translate: 0 10px; rotate: 3deg; } }
@keyframes gbuc-pulse { 0%, 100% { opacity: 0.6; scale: 0.9; } 50% { opacity: 1; scale: 1.1; } }
@keyframes gbuc-panel { from { opacity: 0; transform: translateX(24px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

@media (max-width: 900px) {
  .gbuc { grid-template-columns: 1fr; }
  .gbuc__system { max-width: 400px; margin: 0 auto 30px; }
}
@media (max-width: 600px) {
  .gbuc { padding: 24px 16px; }
  .gbuc__panel dl div { grid-template-columns: 1fr; gap: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  .gbuc *, .gbuc *::before { animation: none !important; transition: none !important; }
}
/* 確認用ページの余白（組み込み時は不要） */
body { margin: 0; background: #02030f; }

body { background: linear-gradient(135deg, #fff 18%, #faf5fb 100%); }
.gbuc {
  grid-template-columns: minmax(300px, 460px) minmax(0, 1fr);
  max-width: 1440px;
  margin: 0 auto;
  padding: clamp(32px, 5vw, 68px) clamp(20px, 5vw, 72px);
  background: transparent;
}
.gbuc__system {
  --gbuc-line: #777da154;
  background: transparent;
}
.gbuc__system button span { top: 92%; color: #535d70; }
.gbuc__system button[aria-selected="true"] span { color: #171d2a; }
.gbuc__copy {
  color: #171d2a;
  font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
.gbuc__copy h2 {
  margin: 0 0 12px;
  font-size: clamp(24px, 3vw, 42px);
  line-height: 1.4;
  letter-spacing: -.045em;
}
.gbuc__copy > p, .gbuc__detail { color: #535d70; margin: 0; }
.gbuc__panel {
  min-height: 112px;
  margin: 22px 0 16px;
  padding: 17px 0;
  background: transparent;
  border: 0;
  border-block: 1px solid #e4e0e8;
  border-radius: 0;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.gbuc__panel h3 { margin: 0 0 6px; font-family: inherit; font-size: clamp(17px, 2vw, 20px); font-weight: 750; }
.gbuc__detail { font-size: 15px; line-height: 1.85; }
.gbuc__link { color: #c9162a; border: 0; font-size: 14px; font-weight: 700; }
.gbuc__link::after { margin-left: .65em; }
.gbuc__link:hover { color: #9c1221; }
.gbuc__system button { isolation: isolate; }
.gbuc__system button::before { inset: 16% 2%; z-index: -1; }
.gbuc__system button[aria-selected="true"]::before {
  --corner: #e52330;
  --corner-arm: clamp(7px, 1vw, 12px);
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background:
    linear-gradient(var(--corner), var(--corner)) left top / var(--corner-arm) 2px,
    linear-gradient(var(--corner), var(--corner)) left top / 2px var(--corner-arm),
    linear-gradient(var(--corner), var(--corner)) right top / var(--corner-arm) 2px,
    linear-gradient(var(--corner), var(--corner)) right top / 2px var(--corner-arm),
    linear-gradient(var(--corner), var(--corner)) left bottom / var(--corner-arm) 2px,
    linear-gradient(var(--corner), var(--corner)) left bottom / 2px var(--corner-arm),
    linear-gradient(var(--corner), var(--corner)) right bottom / var(--corner-arm) 2px,
    linear-gradient(var(--corner), var(--corner)) right bottom / 2px var(--corner-arm);
  background-repeat: no-repeat;
  animation: gbuc-frame-lock .7s cubic-bezier(.19, .75, .29, 1) both;
}
@keyframes gbuc-frame-lock {
  0% { transform: scale(1.5, .65); opacity: 0; }
  45% { transform: scale(1.15, 1.12); opacity: 1; }
  70% { transform: scale(.94, .98); }
  100% { transform: none; }
}
.gbuc__system button[aria-selected="true"] img {
  transform: scale(1.08);
  filter: drop-shadow(0 3px 5px #2d477832);
}
@media (max-width: 900px) {
  .gbuc { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .gbuc__system { width: min(100%, 400px); margin: 0 auto; }
  .gbuc__copy { width: min(100%, 580px); margin: 0 auto; }
}
</style>

<script type="application/json" data-gbuc-data>
[

<script>
/* 選ぶと星系が回り、選んだBotが真上に来る。見えている間はゆっくり自動で巡回（触ったら止まる） */
(function () {
  "use strict";
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  };
  var readData = function () {
    var el = document.querySelector("[data-gbuc-data]");
    if (!el) return [];
    try {
      var parsed = JSON.parse(el.textContent);
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  };
  var render = function (d) {
    return "<h3>" + esc(d.title) + "</h3>" +
      '<p class="gbuc__detail">' + esc(d.text) + "</p>";
  };

  var setup = function (root, data) {
    var system = root.querySelector(".gbuc__system");
    var panel = root.querySelector("[data-gbuc-panel]");
    var tabs = Array.prototype.slice.call(root.querySelectorAll("[data-gbuc-tab]"));
    if (!system || !panel || tabs.length === 0) return;
    var count = Math.min(tabs.length, data.length);
    if (count === 0) return;
    var step = 360 / tabs.length;
    var current = 0;
    var rotation = 0;
    var auto = null;

    var setRadius = function () { system.style.setProperty("--orbit-r", system.clientWidth * 0.35 + "px"); };
    setRadius();
    window.addEventListener("resize", setRadius);

    var select = function (n, focus) {
      // Keep the angle continuous across the last and first tabs.
      var distance = (n - current + tabs.length) % tabs.length;
      if (distance > tabs.length / 2) distance -= tabs.length;
      rotation -= distance * step;
      current = n;
      tabs.forEach(function (t, k) {
        t.setAttribute("aria-selected", String(k === n));
        t.tabIndex = k === n ? 0 : -1;
      });
      if (focus) tabs[n].focus();
      system.style.setProperty("--rot", rotation + "deg");
      panel.innerHTML = render(data[n]);
    };
    var stopAuto = function () { if (auto) { clearInterval(auto); auto = null; } };

    tabs.forEach(function (t, k) {
      t.addEventListener("click", function () { stopAuto(); if (k < count) select(k); });
      t.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); stopAuto(); select((current + 1) % count, true); }
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); stopAuto(); select((current + count - 1) % count, true); }
      });
    });
    select(0);

    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduce && "IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        var e = entries[0];
        if (e.isIntersecting && !auto && root.dataset.touched !== "1") {
          auto = setInterval(function () { select((current + 1) % count); }, 4200);
        } else if (!e.isIntersecting) stopAuto();
      }, { threshold: 0.4 }).observe(root);
    }
    root.addEventListener("pointerdown", function () { root.dataset.touched = "1"; stopAuto(); });
  };

  var init = function () {
    var data = readData();
    Array.prototype.forEach.call(document.querySelectorAll("[data-gbuc]"), function (root) { setup(root, data); });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
